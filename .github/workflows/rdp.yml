name: Connect to Runner via RDP

on: 
  workflow_dispatch: # Allows you to manually trigger the connection

jobs:
  rdp-session:
    runs-on: windows-latest # Provisions a GitHub-hosted Windows VM
    timeout-minutes: 360     # Keeps it alive for up to 6 hours (GitHub's maximum limit)

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup and Enable RDP via Ngrok
      # Uses a pre-built marketplace action to deploy the tunnel and configure an RDP user
      uses: NyaMisty/reverse-rdp-windows-github-actions-ng@master
      with:
        ngrok-token: ${{ secrets.NGROK_AUTH_TOKEN }}
        password: "YourSecurePassword123!" # Change this to your preferred RDP password
