name: Connect to Runner via RDP

on: 
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Setup and Enable RDP via Ngrok (Manual Steps)
      shell: powershell
      run: |
        # 1. Install Ngrok via Chocolatey and reload path environment variable
        Write-Host "Installing Ngrok via Chocolatey..."
        choco install ngrok -y --no-progress
        
        # Manually append the standard Chocolatey bin path to ensure PowerShell catches it immediately
        $env:Path += ";C:\ProgramData\chocolatey\bin"

        # 2. Enable Remote Desktop on the Windows Runner
        Write-Host "Enabling Remote Desktop Services..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # 3. Set a custom secure password for the pre-existing admin account
        $Password = ConvertTo-SecureString "YourSecurePassword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        
        # 4. Authenticate and start the ngrok tunnel on RDP port 3389
        Write-Host "Configuring Ngrok Auth Token..."
        & ngrok authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
        
        Write-Host "Starting RDP tunnel..."
        # This starts ngrok in the background and prints the public endpoint URL
        Start-Process ngrok -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log"
        
        # Wait a few seconds for the tunnel to establish, then parse and print the address
        Start-Sleep -Seconds 7
        if (Test-Path "ngrok.log") {
            Get-Content ngrok.log | Select-String "url=" | ForEach-Object { Write-Host "TUNNEL ADDRESS: $_" }
        } else {
            Write-Host "Error: ngrok.log was not generated."
        }
        
        # 5. Keep the runner alive so the session doesn't end immediately
        Write-Host "RDP is ready. Waiting for connections..."
        while ($true) { Start-Sleep -Seconds 60 }
