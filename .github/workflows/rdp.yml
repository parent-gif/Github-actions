name: Connect to Runner via RDP

on: 
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Setup and Enable RDP via Pinggy (Manual Steps)
      shell: powershell
      run: |
        # 1. Enable Remote Desktop on the Windows Runner
        Write-Host "Enabling Remote Desktop Services..."
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # 2. Set a custom secure password for the pre-existing admin account
        $Password = ConvertTo-SecureString "YourSecurePassword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        
        # 3. Start a raw TCP tunnel on port 3389 using Pinggy (No auth required)
        Write-Host "Starting TCP tunnel via Pinggy..."
        Start-Process ssh -ArgumentList "-R 0:localhost:3389 tcp@pinggy.io -o StrictHostKeyChecking=no" -RedirectStandardOutput "tunnel.log"
        
        # Wait a few seconds for Pinggy to print the connection string
        Start-Sleep -Seconds 7
        if (Test-Path "tunnel.log") {
            Get-Content tunnel.log | ForEach-Object { Write-Host "TUNNEL DETAILS: $_" }
        } else {
            Write-Host "Error: tunnel.log was not generated."
        }
        
        # 4. Keep the runner alive so you can work
        Write-Host "RDP is ready. Waiting for connections..."
        while ($true) { Start-Sleep -Seconds 60 }
